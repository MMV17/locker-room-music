name = "locker-room-music"
main = "src/index.ts"
compatibility_date = "2024-12-18"

# Served on a custom domain for a readable URL and so Cloudflare Tunnel can
# share the zone later. workers.dev stays enabled as a fallback: both hostnames
# route to this Worker, which is useful when DNS for the custom domain is slow
# to propagate (campus resolvers cached the old Namecheap NS delegation for
# hours after the switch).
#
# Note: an earlier comment here claimed the campus firewall blocks *.workers.dev
# by SNI. That was wrong. The handshake failures were Cloudflare having no
# certificate for a hostname that had not been successfully deployed yet.
# Verified 2026-08-03 from campus wifi: workers.dev completes TLS normally.
#
# hc.auxgoat.com is the product hostname. The `hc` label is the school; a
# second school gets its own label, its own Worker, and its own D1, and the
# two never share a row. Nothing in src/ knows the string "hc" — team name and
# colour come from the settings table, which is why /admin can change them —
# so adding a school is a deploy, not a rewrite.
#
# lockerroom.finestkindfarms.com is KEPT DELIBERATELY. The Pi's config names
# exactly one API host, there is no allowlisted command to change it, and over
# HCGuest the Pi cannot be reached at all (TCP/22 is filtered). If the new
# hostname ever fails to resolve and it were the only one, the Pi would go
# dark and take the control channel with it — recoverable only by physically
# standing next to it. A spare hostname costs nothing; do not remove this.
workers_dev = true
routes = [
  { pattern = "hc.auxgoat.com", custom_domain = true },
  { pattern = "lockerroom.finestkindfarms.com", custom_domain = true }
]

# Secrets are set with `wrangler secret put`, never committed:
#   DEVICE_KEY      shared with the Pi
#   MAC_SALT        salts device hashes; changing it orphans every device row
#   TEAM_CODE       what teammates type to join
#   ADMIN_PASSWORD  gate for /api/admin/*

[[d1_databases]]
binding = "DB"
database_name = "lockerroom"
database_id = "d8e68dc0-5eab-42a3-b54c-441b1f79627c"

# The voting site, built from ../web and served from this same Worker.
#
# Same-origin is the point. The session cookie is httpOnly/Secure/SameSite=Lax,
# and a separate Pages origin would mean it is never sent on API fetches — the
# fix for which is relaxing to SameSite=None, weakening it for no gain.
#
# not_found_handling = "none" rather than "single-page-application": SPA mode
# answers *any* unmatched path with index.html, which would swallow /api/*
# before the Worker ever saw it. With "none", misses fall through to Hono and
# the catch-all at the bottom of src/index.ts serves the app shell.
[assets]
directory = "./public"
binding = "ASSETS"
not_found_handling = "none"

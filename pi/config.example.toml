# Copy to /etc/lockerroom/config.toml. Secrets never in the repo.

api_base_url = "https://locker-room-music.example.workers.dev"
device_key = "REPLACE_ME"
# Reported to the server (the heartbeats key). Keep it the same as the
# Bluetooth Name in /etc/bluetooth/main.conf — they are two different
# settings that only look like one, and letting them drift means the site
# names a speaker nobody can find in their Bluetooth list.
speaker_name = "AuxGoat"
# How often the outbox drains. This is how quickly a NEW song reaches the
# site, so it is felt directly as "skips are late". Costs nothing when idle:
# a drain pass with an empty outbox makes no network call at all.
sync_interval_s = 5
db_path = "/var/lib/lockerroom/lockerroom.db"
log_path = "/var/log/lockerroom/listener.log"

# Wifi egress watchdog. Every key below is optional and shown at its default —
# omit the whole table and the watchdog still runs, because the failure it
# guards against (associated, has an IP, no actual egress) is silent.
[netwatch]
# enabled = true
# interface = "wlan0"          # probes are bound to this, so a plugged-in
#                              # ethernet cable cannot mask dead wifi
# connection = ""              # nmcli connection name; "" = look it up live
# probe_interval_s = 60
# timeout_s = 10
# bounce_after = 5             # ~5 min dead  -> nmcli down/up
# restart_nm_after = 10        # ~10 min dead -> restart NetworkManager
# reboot_after = 15            # ~15 min dead -> reboot
# min_reboot_interval_s = 21600  # 6h, so a still-broken box cannot loop

# Bluetooth relay output. OPTIONAL — omit the whole table and the speaker
# behaves exactly as it always has, using USB or the 3.5mm jack. That is the
# safety property this feature rests on: unconfigured means unchanged.
#
# When set, the Pi connects OUTWARD to this speaker as an A2DP source and plays
# through it, so no cable is needed at all — no aux jack, no USB-C, and none of
# the charging-current trouble documented in docs/STATE.md. Pair it once by
# hand first:
#
#   bluetoothctl pair <MAC> && bluetoothctl trust <MAC>
#
# This MAC is excluded from aux arbitration BY IDENTITY in lifecycle.py.
# Without that exclusion the listener treats the far speaker as a DJ, grants it
# the aux and writes it into the play data — which is what made the first relay
# attempt unusable on 2026-08-23.
#
# A malformed value here stops the listener with a clear error rather than
# silently disabling the relay.
# [relay]
# speaker_mac = "AA:BB:CC:DD:EE:FF"

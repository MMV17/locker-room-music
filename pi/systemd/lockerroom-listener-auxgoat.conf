# Drop-in for the listener: keep it restarting, and keep it alive under memory
# pressure.
#
# Installs to /etc/systemd/system/lockerroom-listener.service.d/10-auxgoat.conf
#
# WHY A DROP-IN AND NOT AN EDIT TO lockerroom-listener.service: the updater
# never replaces the listener's own unit file over the air - a bad listener
# unit is a box nobody can reach, and it would take effect outside any trial.
# These two settings cannot stop the unit from starting, so they travel
# separately. pi/tests/test_units.py pins this file to exactly these keys.
[Unit]
# The listener IS the control channel. A crash loop must retry for ever rather
# than trip the default start limit and stay down until someone with a cable
# runs `systemctl reset-failed`.
StartLimitIntervalSec=0

[Service]
# If the box runs out of memory, the listener is the last thing to kill: every
# other process on it can be restarted through the listener, and not the other
# way round.
OOMScoreAdjust=-500

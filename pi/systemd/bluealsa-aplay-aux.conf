# Drop-in for bluealsa-aplay: play one phone, not all of them.
#
# Installs to /etc/systemd/system/bluealsa-aplay.service.d/aux.conf
#
# bluealsa-aplay plays EVERY connected A2DP source unless given a MAC
# allowlist, which is why two phones connected at once were mixed into the
# same speaker. lockerroom writes the current one to the file below and
# restarts this unit; see pi/lockerroom/aux.py.
#
# THE DASH ON EnvironmentFile IS LOAD-BEARING, and so is the bare $AUX_MAC:
#
#   -  a missing file is not an error, so the unit still starts
#   $  an unset or empty unbracketed variable expands to NO argument at all
#      (${AUX_MAC} would pass an empty string, which is not a valid address)
#
# Between them, every way this can go wrong lands on plain
# `bluealsa-aplay -S`, which plays anything — exactly the behaviour that
# existed before any of this. A listener that never started, crashed, or was
# uninstalled leaves a working speaker, never a silent one.
#
# /run is tmpfs, so a reboot clears the file and the same default applies.
[Service]
EnvironmentFile=-/run/lockerroom/aux.env
# Clearing ExecStart before setting it is required — systemd APPENDS to a list
# directive otherwise, and the unit would try to run bluealsa-aplay twice.
ExecStart=
ExecStart=/usr/bin/bluealsa-aplay -S $AUX_MAC

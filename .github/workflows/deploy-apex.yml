# Deploy the front door (apex/, the auxgoat.com landing page) on every merge
# to main that touches it, so it ships the same way the team Worker does.
#
# Until 2026-11-10 this Worker was only ever deployed by hand from a laptop.
#
# Same one-time setup as deploy-worker.yml: the CLOUDFLARE_API_TOKEN secret.
# The Worker has no secrets and no database of its own.
name: Deploy front door

on:
  push:
    branches: [main]
    paths:
      - "apex/**"
      # The front door imports the team-code normaliser from the backend.
      - "backend/src/crypto.ts"
      - ".github/workflows/deploy-apex.yml"
      - ".github/scripts/resolve-worker.sh"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-apex
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: apex
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the Cloudflare token is set
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN repository secret (see deploy-worker.yml), then re-run this workflow."
            exit 1
          fi

      - run: npm ci

      # Tests and typecheck gate the deploy.
      - run: npx vitest run
      - run: npx tsc --noEmit

      - name: Deploy
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID || '7db3c13ee0073570030cac33d8c9f0dc' }}
        run: |
          # Same clean-up as deploy-worker.yml: the secret is pasted by hand.
          TOKEN="$(printf '%s' "$RAW_TOKEN" | tr -d "[:space:]\"'")"
          TOKEN="${TOKEN#Bearer}"
          echo "::add-mask::$TOKEN"
          if ! printf '%s' "$TOKEN" | grep -Eq '^[A-Za-z0-9_-]{35,60}$'; then
            echo "::error::CLOUDFLARE_API_TOKEN does not look like an API token (length ${#TOKEN} after trimming)."
            exit 1
          fi
          export CLOUDFLARE_API_TOKEN="$TOKEN"
          ACCOUNT_ID="$(printf '%s' "$ACCOUNT_ID" | tr -d '[:space:]')"
          if [ -n "$ACCOUNT_ID" ]; then export CLOUDFLARE_ACCOUNT_ID="$ACCOUNT_ID"; fi
          # The front door's name is its workers.dev hostname, which is what a
          # player on a filtered network types. Deploy only to the Worker that
          # already has that name; never create a second one by accident.
          WANT_NAME="$(sed -n 's/^name = "\(.*\)"$/\1/p' wrangler.toml | head -n 1)"
          if [ -z "$WANT_NAME" ]; then
            echo "::error::Could not read the Worker name from apex/wrangler.toml."
            exit 1
          fi
          export WANT_NAME
          TARGET="$(bash ../.github/scripts/resolve-worker.sh)"
          npx wrangler deploy --name "$TARGET"

# Every check a change must pass before it is merged. Merging to main is what
# deploys the Worker (deploy-worker.yml), so this is the gate in front of
# production - and the only automated check the Pi code and its shell scripts
# get at all, since nothing here can reach the speaker.
#
# Each job is independent, so one red job names its own area.
name: CI

on:
  pull_request:
  push:
    branches-ignore: [main]   # main is covered by the deploy workflow's own gate
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (tests + typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - run: npx vitest run
      - run: npx tsc --noEmit -p .

  web:
    name: Web (typecheck + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: web/package-lock.json
      - run: npm ci
      # `build` is `tsc --noEmit && vite build`.
      - run: npm run build

  apex:
    name: Landing page (tests + typecheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: apex
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apex/package-lock.json
      - run: npm ci
      - run: npx vitest run
      - run: npx tsc --noEmit

  pi:
    name: Speaker (pytest + shellcheck)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          # The box runs Debian 13's Python 3.13.
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            pi/requirements.txt
            pi/requirements-dev.txt
      - run: pip install -r pi/requirements.txt -r pi/requirements-dev.txt
      - name: Pi tests
        working-directory: pi
        run: python -m pytest tests -q
      # shellcheck ships on the runner image. Warning level: the scripts run
      # as root on a box nobody can reach, so a quoting slip is not cosmetic.
      - name: Shellcheck
        run: shellcheck -S warning pi/scripts/*.sh backend/scripts/*.sh backend/test/e2e.sh .github/scripts/*.sh
      - name: Deploy-guard tests
        run: bash .github/scripts/test-resolve-worker.sh

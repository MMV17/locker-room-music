# Deploy the voting app (backend Worker + the web build it serves) on every
# merge to main, so a fix can ship without a laptop.
#
# Added 2026-10-31. Until then the Worker was deployed by hand with
# `npm run deploy` from the Mac, which meant nothing could go live from a phone.
#
# ONE-TIME SETUP (GitHub -> repo Settings -> Secrets and variables -> Actions):
#   CLOUDFLARE_API_TOKEN   required. Cloudflare dashboard -> My Profile ->
#                          API Tokens -> "Edit Cloudflare Workers" template.
#   CLOUDFLARE_ACCOUNT_ID  optional; only needed if the token can see more
#                          than one account. Workers & Pages overview, right side.
#
# WHAT THIS DOES NOT DO:
#   - D1 migrations. Run those deliberately, with a backup first, BEFORE the
#     Worker that needs them (see STATE.md, "ORDER MATTERS"). A deploy that
#     needs a migration must not be merged until the migration is applied.
#   - The Pi. The listener ships over deploy.sh / serial-deploy.py; scripts
#     the box runs from the repo ship over the Admin "run repair" button.
#   - apex/ (the landing page), which is its own Worker.
name: Deploy Worker

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - "web/**"
      - ".github/workflows/deploy-worker.yml"
  workflow_dispatch:

# Read-only access to the repo. The deploy credential is the Cloudflare token;
# the workflow's own GitHub token needs nothing beyond checking the code out.
permissions:
  contents: read

# Never two deploys racing each other; the later one wins.
concurrency:
  group: deploy-worker
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Check the Cloudflare token is set
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
        run: |
          if [ -z "$CLOUDFLARE_API_TOKEN" ]; then
            echo "::error::Add the CLOUDFLARE_API_TOKEN repository secret (see the top of this file), then re-run this workflow."
            exit 1
          fi

      - name: Install and typecheck the web app
        working-directory: web
        run: npm ci

      - name: Build the web app into backend/public
        working-directory: web
        run: npm run build

      - name: Install the backend
        working-directory: backend
        run: npm ci

      # Tests and typecheck gate the deploy. A red run here means nothing
      # shipped, which is the point.
      - name: Test the backend
        working-directory: backend
        run: npx vitest run

      - name: Typecheck the backend
        working-directory: backend
        run: npx tsc --noEmit -p .

      - name: Deploy
        working-directory: backend
        env:
          RAW_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          # The secret is pasted by hand, usually from a phone, and the first
          # real run (2026-10-31) failed with Cloudflare code 9106 - a header it
          # could not parse. A stray space, newline or quote does exactly that.
          # A real API token has none of those, so strip them, and a "Bearer "
          # prefix copied from Cloudflare's own curl example.
          TOKEN="$(printf '%s' "$RAW_TOKEN" | tr -d "[:space:]\"'")"
          TOKEN="${TOKEN#Bearer}"
          echo "::add-mask::$TOKEN"
          # API tokens are ~40 characters of letters, digits, - and _. Anything
          # else is a different credential (the Global API Key is 37 hex
          # characters and needs an email too; a token ID is not the token).
          # Say which, without printing it.
          if printf '%s' "$TOKEN" | grep -Eq '^[0-9a-f]{37}$'; then
            echo "::error::CLOUDFLARE_API_TOKEN holds the Global API Key, not an API token. In Cloudflare: My Profile -> API Tokens -> Create Token -> 'Edit Cloudflare Workers', and paste that instead."
            exit 1
          fi
          if ! printf '%s' "$TOKEN" | grep -Eq '^[A-Za-z0-9_-]{35,60}$'; then
            echo "::error::CLOUDFLARE_API_TOKEN does not look like an API token (length ${#TOKEN} after trimming). Create one from the 'Edit Cloudflare Workers' template and paste only the token."
            exit 1
          fi
          export CLOUDFLARE_API_TOKEN="$TOKEN"
          # Only pass the account id when one was given; an empty value is not
          # the same as unset to wrangler.
          ACCOUNT_ID="$(printf '%s' "$ACCOUNT_ID" | tr -d '[:space:]')"
          if [ -n "$ACCOUNT_ID" ]; then export CLOUDFLARE_ACCOUNT_ID="$ACCOUNT_ID"; fi
          find public -name '.DS_Store' -delete 2>/dev/null || true
          npx wrangler deploy

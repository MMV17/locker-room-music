<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#EDF0F5" />
    <meta name="format-detection" content="telephone=no" />
    <meta
      name="description"
      content="AuxGoat — vote on what's playing in your locker room. Enter your team code to find your team."
    />
    <title>AuxGoat</title>
    <link rel="stylesheet" href="./src/landing.css" />
  </head>
  <body>
    <!--
      No JavaScript, deliberately. The form is a plain GET to /go, which the
      Worker resolves and redirects. The destination is a different origin, so
      there is a full navigation either way — a client-side fetch would buy
      nothing and would add a failure mode on exactly the campus wifi this
      product keeps losing.

      The two double-underscore tokens below are substituted by the Worker
      before this page is served, which is how a rejected code is reflected
      back without any script on the page. See backend/src/apex.ts.
    -->
    <main class="wrap">
      <h1 class="mark">AuxGoat</h1>
      <p class="tagline">Vote on what&rsquo;s playing in your locker room.</p>

      <form class="form" action="/go" method="get">
        <label class="label" for="code">Team code</label>
        <input
          class="input"
          id="code"
          name="code"
          type="text"
          value="__CODE__"
          required
          autocapitalize="characters"
          autocomplete="off"
          autocorrect="off"
          spellcheck="false"
          enterkeyhint="go"
          aria-describedby="hint"
        />
        __ERROR__
        <button class="btn" type="submit">Go</button>
      </form>

      <p class="hint" id="hint">
        Don&rsquo;t have a code? Ask whoever set up your team&rsquo;s speaker.
      </p>
    </main>
  </body>
</html>

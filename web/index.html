<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <!-- viewport-fit=cover so the bottom nav can sit above the home indicator -->
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, viewport-fit=cover"
    />
    <meta name="theme-color" content="#EDF0F5" />
    <!-- No zoom-on-focus for the team code and admin fields: iOS zooms any
         input under 16px, and it does not zoom back out. -->
    <meta name="format-detection" content="telephone=no" />
    <!-- The product's name, not the project's. "Locker Room" is what this
         repo is called and what the speaker advertises over Bluetooth; the
         thing a player has open in a tab is AuxGoat. Deliberately not the
         team name — that is operator-set at runtime and this file is static,
         and a tab reading "Crusaders" tells nobody what the site is. -->
    <title>AuxGoat</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
